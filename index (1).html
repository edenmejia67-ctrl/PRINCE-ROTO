const H=f=>(f?["date","name","contact","purpose","person","tin","tout","status","act"]:["name","purpose","person","tin","status","act"]).map(k=>`<th>${t(k)}</th>`).join("");
const rows=(l,f)=>l.length?l.map(v=>`<tr>${f?`<td>${fd(v.tin)}</td>`:""}<td><span class="av" style="background:${["#dbe8ff","#d9f3e4","#e8defc","#ffe9cc"][v.id%4]}">${v.name.split(" ").map(w=>w[0]).slice(0,2).join("")}</span>${esc(v.name)}</td>${f?`<td>${esc(v.contact)}</td>`:""}<td>${pl(v.purpose)}</td><td>${esc(v.person)}</td><td>${ft(v.tin)}</td>${f?`<td>${v.tout?ft(v.tout):"–"}</td>`:""}<td><span class="b ${v.tout?"out":"in"}">${t(v.tout?(f?"out":"outs"):"inside")}</span></td><td>${v.tout?"":`<button class="btn ghost sm" onclick="outV(${v.id})">${t("co")}</button>`}</td></tr>`).join(""):`<tr><td colspan="9" class="mut">${t("none")}</td></tr>`;
const tbl=(l,f)=>`<div class="tw"><table><tr>${H(f)}</tr>${rows(l,f)}</table></div>`;
const byTime=()=>[...V].sort((a,b)=>b.tin.localeCompare(a.tin));
const pages={
dash(){const today=new Date().toDateString(),td=V.filter(v=>new Date(v.tin).toDateString()===today).length,on=V.filter(v=>!v.tout).length;
 const st=[["#2c6df0","user",1,td],["#2fb36a","ucheck",2,on],["#f5a524","bell",3,unread()],["#7c4de8","doc",4,V.length]];
 return`<h1>${t("dashboard")}</h1><p class="mut">${t("welcome")}</p><div class="stats">${st.map(([c,i,n,v])=>`<div class="card stat"><div class="ic" style="background:${c}">${ic(i)}</div><div><span>${t("s"+n)}</span><b>${v}</b><small class="mut">${t("s"+n+"s")}</small></div></div>`).join("")}</div>
 <div class="card"><h2>${t("recent")}</h2>${tbl(byTime().slice(0,6),false)}</div>`},
reg(){const n=new Date();return`<h1>${t("register")}</h1><div class="regw"><form class="card" id="rf" onsubmit="return false" onkeydown="if(event.key==='Enter'&&event.target.tagName==='INPUT'){event.preventDefault();submitReg()}"><h2>${t("vi")}</h2>
 <div class="g2"><div><label>${t("fn")} <i>*</i></label><input name="name" required placeholder="${t("fnp")}"></div><div><label>${t("contact")} <i>*</i></label><input name="contact" type="tel" required placeholder="${t("cnp")}"></div>
 <div><label>${t("pv")} <i>*</i></label><select name="purpose" required><option value="">${t("sp")}</option>${PUR.map(p=>`<option value="${p}">${pl(p)}</option>`).join("")}</select></div>
 <div><label>${t("ptv")} <i>*</i></label><select name="person" required><option value="">${t("spp")}</option>${FAC.map(f=>`<option>${esc(f)}</option>`).join("")}</select></div>
 <div><label>${t("date")} <i>*</i></label><div class="f r"><input readonly value="${fd(n)}">${ic("cal")}</div></div><div><label>${t("tin")} <i>*</i></label><div class="f r"><input id="ti" readonly value="${ft(n)}">${ic("clock")}</div></div></div>
 <div class="row"><button type="button" class="btn" style="min-width:114px" onclick="submitReg()">${t("reg")}</button><button type="button" class="btn ghost" style="min-width:90px" onclick="$('#rf').reset()">${t("clr")}</button></div></form>
 <div class="card"><h2>${t("qa")}</h2><div class="q"><button class="btn" onclick="toast(t('soon'))">${ic("qr")}${t("qr")}</button><button class="btn ghost" onclick="go('rec')">${ic("doc")}${t("vr")}</button></div></div></div>`},
rec(){const q=S.q.toLowerCase(),l=byTime().filter(v=>(!S.from||ymd(v.tin)>=S.from)&&(!S.to||ymd(v.tin)<=S.to)&&(!q||[v.name,v.purpose,pl(v.purpose),v.person,v.contact,fd(v.tin)].join(" ").toLowerCase().includes(q)));
 return`<h1>${t("records")}</h1><form class="filt" onsubmit="return false" onkeydown="if(event.key==='Enter'&&event.target.tagName==='INPUT'){event.preventDefault();applyF()}"><div class="f">${ic("search")}<input id="fq" value="${esc(S.q)}" placeholder="${t("sq")}..."></div><button type="button" class="btn" onclick="applyF()">${t("search")}</button><div class="rng">${ic("cal")}<input type="date" id="ff" value="${S.from}" aria-label="${t("from")}"><span>–</span><input type="date" id="fto" value="${S.to}" aria-label="${t("to")}"></div></form><div class="card" style="padding:8px">${tbl(l,true)}</div>`},
not(){const l=N.map(n=>({n,v:V.find(x=>x.id===n.vid)})).filter(o=>o.v).sort((a,b)=>b.v.tin.localeCompare(a.v.tin));
 return`<div class="row" style="justify-content:space-between;align-items:center;margin-bottom:14px"><h1>${t("notifs")}</h1><button class="btn ghost sm" onclick="readAll()">${t("all")}</button></div>`+
 (l.map(({n,v})=>`<div tabindex="0" role="button" class="nt ${n.read?"":"new"}" onclick="openN(${n.id})" onkeydown="if(event.key==='Enter')openN(${n.id})"><span class="bell">${ic("bell")}</span><div><b class="nm">${t("arrival")}</b><div>${esc(t("msg")(v.name,v.person))}</div></div><div class="r"><span class="mut">${ft(v.tin)}</span><span class="b ${n.read?"rd":"nw"}">${t(n.read?"rd":"nw")}</span></div></div>`).join("")||`<p class="mut">${t("none")}</p>`)},
set(){return`<h1>${t("settings")}</h1><div class="card" style="margin-top:16px;max-width:520px"><h2>${t("lang")}</h2><p class="mut" style="margin:4px 0 12px">${t("langd")}</p>
 <div class="row"><button class="btn ${S.lang==="en"?"":"ghost"}" onclick="setL('en')">English</button><button class="btn ${S.lang==="tl"?"":"ghost"}" onclick="setL('tl')">Tagalog</button></div>
 <hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><button class="btn ghost" onclick="wipe()">${t("wipe")}</button></div>`}};
function render(){document.documentElement.lang=S.lang;const el=$("#root");
 if(!S.auth){el.innerHTML=`<div class="login"><section class="hero">${SEAL}<h2>Dapdap High School</h2><p class="big">${t("sys")}</p><p class="tg">${t("tag")}</p></section>
 <section class="lf"><form id="lf" onsubmit="return false" onkeydown="if(event.key==='Enter'&&event.target.tagName==='INPUT'){event.preventDefault();doLogin()}"><div><h2>${t("wb")}</h2><p class="mut" style="margin-top:4px">${t("lp")}</p></div><div class="f">${ic("user")}<input name="u" required placeholder="${t("user")}" autocomplete="username"></div><div class="f">${ic("lock")}<input id="pw" name="p" type="password" required placeholder="${t("pass")}" autocomplete="current-password"><button type="button" class="eye" onclick="togglePw()" aria-label="Show password">${ic("eyeoff")}</button></div><div class="err" id="err"></div><button type="button" class="btn" onclick="doLogin()">${t("login")}</button><span class="lnk">${t("forgot")}</span><small class="mut">${t("hint")}</small></form></section></div>`;return}
 el.innerHTML=`<div class="app"><aside class="side"><div class="brand">${SEAL}<div>Dapdap High School<small>${t("sys")}</small></div></div>
 ${NAV.map(([p,i,k])=>`<button type="button" class="ni ${S.page===p?"on":""}" onclick="go('${p}')">${ic(i)}<span>${t(k)}</span>${p==="not"&&unread()?`<b class="dot">${unread()}</b>`:""}</button>`).join("")}
 <button type="button" class="ni lo" onclick="logout()">${ic("out")}<span>${t("logout")}</span></button></aside><main><div class="top"><span>${ic("bell")}</span><span>${ic("user")}Security Guard ▾</span><span id="clk"></span></div>${pages[S.page]()}</main></div>`;tick()}
const togglePw=()=>{const p=$("#pw");p.type=p.type==="password"?"text":"password"};
function openN(id){const n=N.find(x=>x.id===id),v=n&&V.find(x=>x.id===n.vid);if(!v)return;n.read=true;save();render();
 $("#mo").innerHTML=`<div class="ov" onclick="closeM()"><div class="md" onclick="event.stopPropagation()"><div class="mh"><span class="bell">${ic("bell")}</span><div><b>${t("nt")}</b><div class="mut">${t("ntd")}</div></div></div><dl><dt>${t("vn")}:</dt><dd>${esc(v.name)}</dd><dt>${t("purpose")}:</dt><dd>${pl(v.purpose)}</dd><dt>${t("ptv")}:</dt><dd>${esc(v.person)}</dd><dt>${t("ta")}:</dt><dd>${ft(v.tin)}</dd></dl><button class="btn" onclick="viewD(${v.id})">${t("vd")}</button><small class="mut">Dapdap High School – ${t("sys")}</small></div></div>`}
const closeM=()=>{$("#mo").innerHTML=""};
function viewD(id){const v=V.find(x=>x.id===id);S.q=v?v.name:"";S.from=S.to="";closeM();go("rec")}
function tick(){const n=new Date(),c=$("#clk"),ti=$("#ti");if(c)c.textContent=fd(n)+", "+ft(n);if(ti)ti.value=ft(n)}
setInterval(tick,15000);
const go=p=>{S.page=p;render();window.scrollTo(0,0)};
function doLogin(){const d=new FormData($("#lf"));if(d.get("u").trim()==="guard"&&d.get("p")==="guard123"){S.auth=true;sv("dhs_auth",true);render()}else $("#err").textContent=t("bad")}
function logout(){S.auth=false;S.page="dash";sv("dhs_auth",false);render()}
function submitReg(){const f=$("#rf");if(!f.reportValidity())return;const d=new FormData(f),v={id:Date.now(),name:d.get("name").trim(),contact:d.get("contact").trim(),purpose:d.get("purpose"),person:d.get("person"),tin:new Date().toISOString(),tout:null};
 if(!v.name)return;V.push(v);N.push({id:v.id,vid:v.id,read:false});save();render();toast(t("okReg").replace("{p}",v.person))}
function outV(id){const v=V.find(x=>x.id===id);if(v){v.tout=new Date().toISOString();save();render();toast(t("okOut"))}}
function applyF(){S.q=$("#fq").value;S.from=$("#ff").value;S.to=$("#fto").value;render()}
function readN(id){const n=N.find(x=>x.id===id);if(n){n.read=true;save();render()}}
function readAll(){N.forEach(n=>n.read=true);save();render()}
function setL(l){S.lang=l;sv("dhs_lang",l);render()}
function wipe(){if(confirm(t("wipeq"))){V=seed();N=V.map((v,i)=>({id:i+1,vid:v.id,read:i>0}));save();render()}}
render();
</script></body></html>
