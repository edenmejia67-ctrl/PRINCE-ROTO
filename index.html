 try{const r=await fetch(`${DB.cfg.server.replace(/\/+$/,"")}/${encodeURIComponent(f.topic)}`,{method:"POST",headers:{Title:title,Priority:"5"},body:msg});
  if(r.ok)return{s:"accepted",at:iso(),code:r.status};
  return{s:"failed",at:iso(),code:r.status,err:`HTTP ${r.status}${r.status===429?" (rate limited, wait and retry)":r.status===404?" (check server URL)":""}`}
 }catch(e){return{s:"failed",at:iso(),err:navigator.onLine?"No response: network, blocked by browser/ad blocker, or wrong server URL":"This device is offline"}}}
